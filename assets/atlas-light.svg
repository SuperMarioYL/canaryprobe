<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: init plants decoys; watch runs DNS + TCP sensors into alarm and audit.jsonl; report reads the audit log into report.md">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
    <marker id="at-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D62828"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- lane labels -->
  <text x="34" y="40" font-size="13" font-weight="700" fill="#6E6E73">canaryprobe init</text>
  <text x="34" y="150" font-size="13" font-weight="700" fill="#6E6E73">canaryprobe watch  (one process, two sensor threads)</text>
  <text x="34" y="300" font-size="13" font-weight="700" fill="#6E6E73">canaryprobe report</text>

  <!-- connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <!-- init -> decoys -->
    <line x1="196" y1="72" x2="300" y2="72" marker-end="url(#ah-l)"/>
    <!-- decoys down into watch (operator pastes decoy) -->
    <line x1="370" y1="98" x2="370" y2="168" marker-end="url(#ah-l)"/>
    <!-- agent -> dns sensor -->
    <line x1="196" y1="200" x2="300" y2="188" marker-end="url(#at-l)" stroke="#D62828"/>
    <!-- agent -> conn sensor -->
    <line x1="196" y1="212" x2="300" y2="240" marker-end="url(#at-l)" stroke="#D62828"/>
    <!-- dns -> alarm -->
    <line x1="470" y1="188" x2="600" y2="200" marker-end="url(#ah-l)"/>
    <!-- conn -> alarm -->
    <line x1="470" y1="240" x2="600" y2="216" marker-end="url(#ah-l)"/>
    <!-- alarm -> audit.jsonl (down) -->
    <line x1="690" y1="248" x2="690" y2="300" marker-end="url(#ah-l)"/>
    <!-- audit.jsonl -> report (across bottom) -->
    <line x1="630" y1="320" x2="470" y2="320" marker-end="url(#ah-l)"/>
    <!-- report -> report.md -->
    <line x1="300" y1="320" x2="210" y2="320" marker-end="url(#ah-l)"/>
  </g>

  <!-- INIT lane -->
  <g>
    <rect x="34" y="48" width="162" height="48" rx="14" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="115" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#0A4F9E">init / plant</text>
    <text x="115" y="88" text-anchor="middle" font-size="10.5" fill="#6E6E73">decoy.py · mint decoys</text>

    <rect x="300" y="48" width="150" height="48" rx="14" fill="#F0A202" fill-opacity="0.12" stroke="#F0A202" stroke-width="1.5"/>
    <text x="375" y="70" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8A5B00">decoys.json</text>
    <text x="375" y="86" text-anchor="middle" font-size="10.5" fill="#6E6E73">+ signed manifest</text>
  </g>

  <!-- WATCH lane -->
  <g>
    <!-- coding agent (the untrusted binary) -->
    <rect x="34" y="176" width="162" height="60" rx="14" fill="#6E6E73" fill-opacity="0.10" stroke="#6E6E73" stroke-width="1.5"/>
    <text x="115" y="200" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3A3A44">closed coding agent</text>
    <text x="115" y="218" text-anchor="middle" font-size="10.5" fill="#6E6E73">binary you can't read</text>
    <text x="115" y="232" text-anchor="middle" font-size="9.5" fill="#D62828">resolves / connects a decoy</text>

    <rect x="300" y="164" width="170" height="44" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
    <text x="385" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#4B3FC4">sensor_dns.py</text>
    <text x="385" y="198" text-anchor="middle" font-size="10" fill="#6E6E73">authoritative DNS · catch resolve</text>

    <rect x="300" y="220" width="170" height="44" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
    <text x="385" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#4B3FC4">sensor_conn.py</text>
    <text x="385" y="254" text-anchor="middle" font-size="10" fill="#6E6E73">TCP listener · catch connect</text>

    <rect x="600" y="182" width="90" height="52" rx="14" fill="#D62828" fill-opacity="0.10" stroke="#D62828" stroke-width="1.5"/>
    <text x="645" y="205" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A31D1D">alarm.py</text>
    <text x="645" y="221" text-anchor="middle" font-size="10" fill="#6E6E73">TRIPPED</text>
  </g>

  <!-- audit + report -->
  <g>
    <rect x="630" y="300" width="130" height="42" rx="14" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5"/>
    <text x="695" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#0B6B53">audit.jsonl</text>
    <text x="695" y="335" text-anchor="middle" font-size="9.5" fill="#6E6E73">TripEvent · append-only</text>

    <rect x="300" y="300" width="130" height="42" rx="14" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="365" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#0A4F9E">report.py</text>
    <text x="365" y="335" text-anchor="middle" font-size="9.5" fill="#6E6E73">read audit log</text>

    <rect x="60" y="300" width="150" height="42" rx="14" fill="#F0A202" fill-opacity="0.12" stroke="#F0A202" stroke-width="1.5"/>
    <text x="135" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#8A5B00">report.md</text>
    <text x="135" y="335" text-anchor="middle" font-size="9.5" fill="#6E6E73">signed clean / TRIPPED</text>
  </g>
</svg>
