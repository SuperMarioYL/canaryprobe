[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canaryprobe"
version = "0.7.0"
description = "A honeytoken tripwire that catches a closed-source coding agent probing planted decoys — turns \"did it exfiltrate?\" into a checkable yes/no event."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "coding-agent",
    "honeytoken",
    "canary",
    "tripwire",
    "egress",
    "security",
    "dns",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "dnslib>=0.9.25",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/canaryprobe"
Repository = "https://github.com/SuperMarioYL/canaryprobe"
Issues = "https://github.com/SuperMarioYL/canaryprobe/issues"
Changelog = "https://github.com/SuperMarioYL/canaryprobe/blob/main/CHANGELOG.md"

[project.scripts]
canaryprobe = "canaryprobe.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["canaryprobe"]

[tool.hatch.build.targets.sdist]
include = [
    "canaryprobe",
    "examples",
    "tests",
    "README.md",
    "README.en.md",
    "LICENSE",
    "CHANGELOG.md",
    "VERSION",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
